name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only. Individual jobs/steps can opt in to more.
permissions:
  contents: read

jobs:
  # Shell scripts — 39 kB of install and release automation that until now was
  # only ever executed by a user hitting a bug in it.
  #
  # Four install defects landed in one week (#173, #174, #175, and a shell
  # dialect one), all found in production because nothing here was checked.
  # Two more were dead variables nobody noticed. That is the gap this closes.
  #
  # The gate is `shellcheck -S style`, the strictest level, because the scripts
  # are already clean at it — three findings were fixed to get there rather than
  # loosening the gate to accommodate them. Starting strict is the only way it
  # stays strict; a gate set to `error` would have passed all six defects above.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `git ls-files` rather than a hardcoded list: a script added under a new
      # directory is exactly the one nobody remembers to add to CI, and a gate
      # that silently skips files reads as coverage without being it.
      - name: Lint every tracked shell script
        run: |
          set -euo pipefail
          # Preinstalled on GitHub's ubuntu images; installed here rather than
          # assumed, so a runner-image change fails the lint instead of the job.
          command -v shellcheck >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version | head -2
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          echo "checking ${#files[@]} scripts"
          printf '  %s\n' "${files[@]}"
          shellcheck -S style -f gcc "${files[@]}"

      # `shellcheck` parses; it does not prove bash agrees. Cheap second opinion.
      - name: Parse every tracked shell script
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          for f in "${files[@]}"; do bash -n "$f"; done

      # The macOS installer's two refusals. Both exit 1, so the message is what
      # distinguishes them — asserting only the code would let either guard
      # rot into the other's error and still pass.
      #
      # The bash guard is the one that matters most: the shebang is not
      # consulted for a piped script, so `curl … | sh` runs this under dash and
      # used to abort with an "unbound variable" from a shell nobody chose.
      #
      # `/bin/dash` explicitly, not `sh`. `/bin/sh` is dash on this runner but
      # bash on Arch and several other distros, and under bash the guard
      # correctly does *not* fire — so an `sh`-based test would pass by
      # verifying nothing on any machine where that symlink differs. Asserting
      # the interpreter leaves BASH_VERSION unset is what makes the rest of the
      # step mean something.
      - name: install.sh refuses a non-bash interpreter
        run: |
          set -euo pipefail
          [ -x /bin/dash ] || { echo "no /bin/dash to test with"; exit 1; }
          /bin/dash -c '[ -z "${BASH_VERSION:-}" ]' \
            || { echo "/bin/dash sets BASH_VERSION — this test would be vacuous"; exit 1; }
          out="$(/bin/dash scripts/install.sh 2>&1 || true)"
          echo "$out"
          /bin/dash scripts/install.sh >/dev/null 2>&1 && { echo "expected non-zero exit"; exit 1; }
          grep -q "needs bash" <<<"$out" || { echo "wrong guard fired"; exit 1; }

      - name: install.sh refuses to run on Linux
        run: |
          set -euo pipefail
          out="$(bash scripts/install.sh 2>&1 || true)"
          bash scripts/install.sh >/dev/null 2>&1 && { echo "expected non-zero exit"; exit 1; }
          echo "$out"
          grep -q "install-linux.sh" <<<"$out" \
            || { echo "should point Linux users at the Linux installer"; exit 1; }

      # `--print-deps` documents itself as changing nothing, which makes it a
      # free smoke test of distro detection and the package tables. It runs the
      # `/etc/os-release` parse and the family `case` for real.
      - name: install-linux.sh dry-run paths
        run: |
          set -euo pipefail
          bash scripts/install-linux.sh --print-deps
          bash scripts/install-linux.sh --help >/dev/null
          bash scripts/install-linux.sh --bogus >/dev/null 2>&1 && {
              echo "an unknown option must not succeed"; exit 1; }
          rc=0; bash scripts/install-linux.sh --bogus >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "expected exit 2 for a bad option, got $rc"; exit 1; }

  # Linux build — the daemon, the GTK GUI, the shared core, the MCP server
  # and the engine.
  #
  # These are named explicitly with `-p`. A bare `cargo build` obeys
  # `default-members`, which is only supermgr-core + supermgr-mcp — so it
  # silently skipped supermgrd and supermgr (~35k lines and 50-odd tests)
  # while this job installed GTK for them. Naming the crates is what makes
  # the job mean what its title says.
  #
  # `supermgrd-mac` / `supermanager-helper` stay out: they need launchd and
  # the Apple SDKs, and the `mac` job below covers them.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Vendor pins first: it is seconds of curl, and it is the check most
      # likely to fail for reasons that have nothing to do with the commit
      # under test.
      #
      # The Windows job stages these same files and verifies the same
      # hashes, but ~15 minutes into a build on our slowest runner, so a
      # stale pin cost a full Windows build to discover. It also enforces
      # what Windows cannot: that no entry points at a rotating "latest"
      # pointer. That rule is why the pin goes stale in the first place,
      # and one such rotation silently moved the bundled OpenVPN from 2.6
      # to 2.7 — a major version change in a shipped VPN client that
      # nobody chose. See vendor/manifest.toml.
      #
      # Runs on every PR rather than only when the manifest changes:
      # upstream can invalidate a pin without anyone touching the repo,
      # and finding that out here beats finding it out in Windows.
      - name: Verify vendor pins
        run: ./scripts/check-vendor-pins.sh
      # tcpdump is a runtime dependency of the engine's traffic-sniff
      # analysis, and its tests shell out to it. Installed explicitly rather
      # than relying on whatever the runner image happens to ship.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config tcpdump
      - name: Build
        run: |
          cargo build --release \
            -p supermgr-core \
            -p supermgr-engine \
            -p supermgr-mcp \
            -p supermgrd \
            -p supermgr
      # `-D warnings` is what makes this step a gate rather than a report.
      # It covers every rustc lint (unused imports and variables, dead
      # code, unreachable patterns) plus clippy's correctness, suspicious
      # and perf groups — the categories that catch defects. Two real bugs
      # were sitting in that output while the step ran `-W warnings` and
      # could never fail: a mail port reported as cleartext because its
      # match arm was unreachable, and a kill switch whose two branches
      # were identical.
      #
      # style, complexity and pedantic stay advisory. They are ~76 mostly
      # cosmetic findings (doc-comment indentation is the bulk of it);
      # gating on them would have meant a churn-heavy diff for no defect
      # caught. Promote them once they're worked down.
      #
      # The toolchain above is `stable`, which floats. A new Rust can add
      # or sharpen a lint and turn this step red on a PR that changed
      # nothing related — that is not a mystery failure, it is the float.
      # When it happens, fix the lint; reach for `#[allow]` only when the
      # finding genuinely isn't worth acting on, and say why in the code.
      # To reproduce a CI-only finding locally, match the version rather
      # than guessing:
      #
      #   rustup toolchain install <version> --component clippy
      #   rustup run <version> cargo clippy --all-targets -p ... -- -D warnings ...
      #
      # Pinning the toolchain instead would trade these surprises for
      # manual bumps; that's a repo-wide policy call, not a clippy one.
      - name: Clippy
        run: |
          cargo clippy --all-targets \
            -p supermgr-core \
            -p supermgr-engine \
            -p supermgr-mcp \
            -p supermgrd \
            -p supermgr \
            -- -D warnings \
               -A clippy::pedantic \
               -A clippy::style \
               -A clippy::complexity
      - name: Tests
        run: |
          cargo test \
            -p supermgr-core \
            -p supermgr-engine \
            -p supermgr-mcp \
            -p supermgrd \
            -p supermgr

  # macOS build + test — exercises the Mac-only Rust crates plus
  # the SwiftUI app via `xcodebuild test`. Signing is disabled
  # because GitHub-hosted runners have no Apple Developer identity.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The macOS installer, on macOS, under the interpreter it will actually
      # meet: Apple ships /bin/bash 3.2 and has since 2007, while the `shell`
      # job above runs bash 5.x. That gap is a real bug class — 3.2 has no
      # `mapfile`, no associative arrays, no `${x,,}` — and it cannot be caught
      # on a Linux runner.
      #
      # `install.sh` exits early on Linux, so this is also the only place the
      # release lookup gets exercised: a curl|grep|grep|head|sed pipeline over
      # the GitHub API that breaks silently if the response shape changes or no
      # Mac zip has shipped. The dry run stops before the download and before
      # anything touches /Applications.
      - name: install.sh dry run under Apple's bash 3.2
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          SUPERMGR_INSTALL_DRY_RUN=1 /bin/bash scripts/install.sh

      # xcodegen turns `SuperManagerMac/project.yml` → `.xcodeproj`.
      # pandoc is the engagement-report renderer; install so report
      # tests (if/when added) don't get skipped.
      - name: Install build deps
        run: |
          brew update
          brew install xcodegen pandoc xcbeautify

      # Build the Mac stack explicitly. We can't use `--workspace`
      # because that would also pull in `supermgr` (the Linux GTK
      # GUI) whose pango-sys dependency doesn't build on macOS.
      # Same `-p <crate>` list the local `build.sh` uses.
      - name: Build (Mac crates)
        run: |
          cargo build --release \
            -p supermgr-core \
            -p supermgr-engine \
            -p supermgrd-mac \
            -p supermanager-helper

      - name: Tests (Mac crates)
        run: |
          cargo test \
            -p supermgr-core \
            -p supermgr-engine \
            -p supermgrd-mac \
            -p supermanager-helper

      # Generate the Xcode project from project.yml.
      - name: xcodegen
        run: |
          cd SuperManagerMac
          xcodegen generate

      # Run the Swift unit-test target (`SuperManagerMacTests`).
      # `xcodebuild test` builds the host app AND the test bundle,
      # then runs every XCTest in the test target. Signing disabled
      # because the runner has no Developer identity.
      #
      # Pipe raw xcodebuild output to a log file as well as
      # xcbeautify — the GitHub-actions renderer hides the actual
      # error text and we need the raw form when a compile fails.
      - name: Test (SwiftUI + XCTest)
        shell: bash
        run: |
          set -o pipefail
          cd SuperManagerMac
          xcodebuild test \
            -project SuperManager.xcodeproj \
            -scheme SuperManagerMac \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 \
            | tee /tmp/xcodebuild.log \
            | xcbeautify --renderer github-actions \
            || {
                echo "::group::Raw xcodebuild output (last 200 lines)"
                tail -200 /tmp/xcodebuild.log
                echo "::endgroup::"
                echo "::group::Compile errors only"
                grep -E "error:|warning:" /tmp/xcodebuild.log | head -50 || true
                echo "::endgroup::"
                exit 1
            }

  # Windows build — exercises the Windows-only crates (supermgrd-win,
  # supermgr-win) plus the cross-platform supermgr-core / supermgr-mcp.
  # The Linux daemon (supermgrd) and Mac stack are excluded because
  # their D-Bus / strongSwan / launchd deps don't exist on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build (Windows crates)
        run: |
          cargo build --release `
            -p supermgr-core `
            -p supermgr-mcp `
            -p supermgrd-win `
            -p supermgr-win

      # supermgrd-win / supermgr-win carry no tests of their own yet, but
      # naming them still compiles their `#[cfg(test)]` code — which a
      # plain `cargo build` never does, and which is where test-only
      # compile errors hide.
      - name: Tests (Windows + cross-platform crates)
        run: |
          cargo test `
            -p supermgr-core `
            -p supermgr-mcp `
            -p supermgrd-win `
            -p supermgr-win

      # Build the MSI on every push to main + every PR — catches WiX
      # schema mistakes before they hit a release tag. Cached
      # extensions across runs would be nice but `wix extension add`
      # is fast enough not to bother.
      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 --global
          wix extension add WixToolset.Util.wixext/5.0.2 --global
          wix extension add WixToolset.BootstrapperApplications.wixext/5.0.2 --global

      # Stage WireGuard + OpenVPN upstream MSIs so the Burn bundle
      # build below works on every push - catches schema regressions
      # in bundle.wxs before a release tag.
      - name: Stage vendor binaries
        run: .\scripts\windows\Get-VendorFiles.ps1

      - name: Build MSI + Burn bundle
        run: .\installer\wix\build-msi.ps1 -SkipBuild -Bundle

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SuperManager-installer-${{ github.sha }}
          path: |
            installer/wix/SuperManager.msi
            installer/wix/SuperManager-Setup.exe
          retention-days: 14
