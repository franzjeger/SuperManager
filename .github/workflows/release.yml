name: Release
# Triggered when a `v*.*.*` tag is pushed.
#
# Pipeline order:
#   1. `ci` runs the full cross-platform CI matrix (`shell`, `linux`, `mac`,
#      `windows`) on the tagged commit before any signing keys or release
#      environments are entered.
#   2. `build-macos` and `build-windows` build, test, sign/notarise, and upload
#      immutable build artifacts without `contents: write` or persisted git
#      credentials.
#   3. `publish` collects both platform artifact sets, stages a single draft
#      GitHub Release with every asset attached, publishes the release once all
#      uploads succeed, and finally updates `appcast.xml` / `appcast-beta.xml`
#      on `main`.
#
# Required repository secrets (Settings → Secrets and variables →
# Actions → Repository secrets):
#
#   MACOS_CERTIFICATE              — Developer ID Application .p12, base64
#   MACOS_CERTIFICATE_PASSWORD     — Password for MACOS_CERTIFICATE
#   MACOS_DEV_ID_APP               — Common Name from `security find-identity`
#   MACOS_INSTALLER_CERT           — Optional Developer ID Installer .p12, base64
#   MACOS_INSTALLER_CERT_PASSWORD  — Password for MACOS_INSTALLER_CERT
#   MACOS_DEV_ID_INSTALLER         — Common Name of the installer cert
#   AC_API_KEY_BASE64              — App Store Connect AuthKey_XXXXXX.p8, base64
#   AC_API_KEY_ID                  — 10-char key id from App Store Connect
#   AC_API_ISSUER_ID               — UUID from App Store Connect → Integrations
#   SPARKLE_PRIVATE_KEY            — Sparkle EdDSA private key (base64)

on:
  push:
    tags:
      - 'v*.*.*'

# Serialize provisioning, release publication, and appcast commits across tags.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-macos:
    needs: [ci]
    runs-on: macos-26
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.99.1
        with:
          toolchain: "1.99.1"

      - name: Install build deps
        run: |
          brew update
          brew install xcodegen pandoc xcbeautify tailscale wireguard-go cmake

      # Temporary per-run keychain destroyed in the `always()` teardown step.
      - name: Set up signing keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
        run: |
          set -euo pipefail
          KCHAIN_PW=$(openssl rand -hex 16)
          echo "::add-mask::$KCHAIN_PW"
          security create-keychain -p "$KCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          if [ -n "$MACOS_INSTALLER_CERT" ]; then
            printf '%s' "$MACOS_INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
            security import "$RUNNER_TEMP/installer-cert.p12" \
              -k build.keychain \
              -P "$MACOS_INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productsign \
              -T /usr/bin/security
            rm -f "$RUNNER_TEMP/installer-cert.p12"
            echo "DEVELOPER_ID_INSTALLER=$MACOS_DEV_ID_INSTALLER" >> "$GITHUB_ENV"
            echo "Installer cert imported: $MACOS_DEV_ID_INSTALLER"
          else
            echo "MACOS_INSTALLER_CERT not set — .pkg will be unsigned."
          fi

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KCHAIN_PW" \
            build.keychain
          security find-identity -p codesigning -v build.keychain

      - name: Stage AC API key
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect"
          chmod 700 "$HOME/.appstoreconnect"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/AuthKey_${AC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/AuthKey_${AC_API_KEY_ID}.p8"
          echo "AC_API_KEY_PATH=$HOME/.appstoreconnect/AuthKey_${AC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve SwiftPM packages
        run: |
          cd SuperManagerMac
          xcodegen generate
          xcodebuild -resolvePackageDependencies \
            -project SuperManager.xcodeproj \
            -scheme SuperManagerMac

      - name: Build, sign, notarise, staple, Sparkle-sign
        env:
          DEVELOPER_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing v$VERSION"
          ./scripts/release.sh "$VERSION"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-dist
          path: |
            dist/SuperManager-*.zip
            !dist/*-notarize.zip
            dist/SuperManager-vpn-dns-cleanup-*.pkg
            dist/appcast*.xml
          if-no-files-found: error
          retention-days: 1

      - name: Tear down keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer-cert.p12" || true
          rm -f "$HOME/.appstoreconnect/AuthKey_"*.p8 || true

  build-windows:
    needs: [ci]
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.99.1
        with:
          toolchain: "1.99.1"

      - name: Cargo build (release)
        env:
          SUPERMGR_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cargo build --release --locked `
            -p supermgrd-win `
            -p supermgr-win `
            -p supermgr-mcp

      - name: Test Windows daemon
        run: cargo test --release --locked -p supermgr-core -p supermgrd-win -p supermgr-win -p supermgr-mcp

      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 --global
          wix extension add WixToolset.Util.wixext/5.0.2 --global
          wix extension add WixToolset.BootstrapperApplications.wixext/5.0.2 --global

      - name: Stage vendor binaries
        run: .\scripts\windows\Get-VendorFiles.ps1

      - name: Build MSI + Burn bundle
        run: .\installer\wix\build-msi.ps1 -SkipBuild -Bundle

      - name: Test complete Windows installation
        run: .\scripts\windows\test-installer.ps1

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-test-logs
          path: ${{ runner.temp }}/supermanager-installer-test/
          if-no-files-found: ignore

      - name: Stage and hash Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory -Force -Path "dist-win" | Out-Null
          $msi = "dist-win\SuperManager-$version.msi"
          $exe = "dist-win\SuperManager-Setup-$version.exe"
          Move-Item "installer\wix\SuperManager.msi"       $msi
          Move-Item "installer\wix\SuperManager-Setup.exe" $exe
          foreach ($p in @($msi, $exe)) {
              $hash = (Get-FileHash $p -Algorithm SHA256).Hash
              "$hash  $(Split-Path -Leaf $p)" |
                  Out-File -FilePath "$p.sha256" -Encoding ascii
              Write-Host "SHA-256 $(Split-Path -Leaf $p): $hash"
          }
          $stableExe = "dist-win\SuperManager-Setup.exe"
          Copy-Item $exe $stableExe
          $stableHash = (Get-FileHash $stableExe -Algorithm SHA256).Hash
          "$stableHash  SuperManager-Setup.exe" |
              Out-File -FilePath "$stableExe.sha256" -Encoding ascii

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-dist
          path: dist-win/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-release-dist
          path: release-assets/macos

      - name: Download Windows release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-release-dist
          path: release-assets/windows

      - name: Verify complete cross-platform artifact set
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FEED_FILE="appcast-beta.xml"
          else
            FEED_FILE="appcast.xml"
          fi
          for required in \
            "release-assets/macos/SuperManager-${VERSION}.zip" \
            "release-assets/macos/SuperManager-vpn-dns-cleanup-${VERSION}.pkg" \
            "release-assets/macos/${FEED_FILE}" \
            "release-assets/windows/SuperManager-${VERSION}.msi" \
            "release-assets/windows/SuperManager-${VERSION}.msi.sha256" \
            "release-assets/windows/SuperManager-Setup-${VERSION}.exe" \
            "release-assets/windows/SuperManager-Setup-${VERSION}.exe.sha256" \
            "release-assets/windows/SuperManager-Setup.exe" \
            "release-assets/windows/SuperManager-Setup.exe.sha256"
          do
            [ -s "$required" ] || { echo "missing or empty release asset: $required" >&2; exit 1; }
          done
          command -v xmllint >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          xmllint --noout "release-assets/macos/${FEED_FILE}"

      - name: Stage draft GitHub Release with all assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/SuperManager-*.zip
            release-assets/macos/SuperManager-vpn-dns-cleanup-*.pkg
            release-assets/macos/appcast*.xml
            release-assets/windows/SuperManager-*.msi
            release-assets/windows/SuperManager-*.msi.sha256
            release-assets/windows/SuperManager-Setup-*.exe
            release-assets/windows/SuperManager-Setup-*.exe.sha256
            release-assets/windows/SuperManager-Setup.exe
            release-assets/windows/SuperManager-Setup.exe.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Publish appcast to main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FEED_FILE="appcast-beta.xml"
          else
            FEED_FILE="appcast.xml"
          fi
          cp "release-assets/macos/$FEED_FILE" "$RUNNER_TEMP/$FEED_FILE"
          git fetch origin main
          git checkout --detach origin/main
          cp "$RUNNER_TEMP/$FEED_FILE" "$FEED_FILE"
          if git diff --quiet -- "$FEED_FILE"; then
            echo "$FEED_FILE is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FEED_FILE"
          git commit -m "chore(release): publish ${GITHUB_REF_NAME} appcast"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
