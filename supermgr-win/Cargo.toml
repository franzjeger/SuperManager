[package]
name        = "supermgr-win"
version     = "1.0.0"
edition     = "2021"
description = "SuperManager desktop GUI for Windows (Slint frontend)"
license     = "GPL-3.0-or-later"

[[bin]]
name = "supermgr-win"
path = "src/main.rs"

[dependencies]
supermgr-core = { path = "../supermgr-core" }

anyhow             = { workspace = true }
chrono             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }

# Windows-only UI stack lives behind a target gate so off-Windows tooling
# (rust-analyzer, `cargo check` on a Linux dev box) can still resolve the
# crate without pulling Slint's native code or the tray-icon's Win32
# dependencies. The actual binary refuses to start anywhere except Windows
# (see `main.rs`).
[target.'cfg(target_os = "windows")'.dependencies]
# Slint 1.x — pure-Rust UI framework. We pin to the `winit` backend with the
# `software` renderer disabled (GPU path is fine on Windows and faster) and
# turn off live-reload so the release build doesn't include the file watcher.
#
# `accessibility` exposes the UI to screen readers through UI Automation.
# `raw-window-handle-06` lets the file picker open as a dialog of this
# window rather than a free-floating one.
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-skia", "accessibility", "raw-window-handle-06"] }

# Cross-platform tray-icon abstraction. Backed by Win32 NotifyIcon on Windows.
tray-icon = "0.19"

# winit event loop integration: tray-icon needs a winit event source for the
# menu events. Slint's winit backend re-exports the version it pins, so we
# match here.
winit = "0.30"

# Cross-platform clipboard. On Windows it wraps OpenClipboard /
# SetClipboardData via the `clipboard-win` crate — no Win32 plumbing in
# our own code.
arboard = { version = "3.4", default-features = false }

# The native Open dialog, for choosing a VPN config file.
rfd = { version = "0.17", default-features = false }

# Azure publishes a VPN profile as a .zip; reading it directly spares the
# operator unpacking it. Decompression only.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ShellExecuteW (open a sign-in page in the default browser) and the
# registry value that says whether Windows is in dark mode.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# In-app updater: GitHub Releases API + installer download (reqwest),
# SHA-256 verification against the published .sha256 sidecar (sha2),
# streaming the download to disk (futures-util). Windows-gated with the
# rest of the UI stack because only `src/win/update.rs` uses them.
reqwest      = { workspace = true }
hex          = { workspace = true }
sha2         = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Slint code generation runs in build.rs; the slint-build crate produces Rust
# from the `.slint` UI files at compile time. `winres` embeds the
# VS_FIXEDFILEINFO version resource for File Explorer Properties + the MSI.
#
# Unconditional, not behind a target cfg. A build script runs on the *host*,
# so gating these on `cfg(target_os = "windows")` meant a Linux or macOS
# machine could not type-check this crate for Windows at all: the UI was
# never generated and `slint::include_modules!()` had nothing to include.
# build.rs now decides from `CARGO_CFG_TARGET_OS`, which is the target, and
# nothing but an explicit `-p supermgr-win` ever builds this crate.
[build-dependencies]
slint-build = "1.8"
winres      = "0.1"

[lints]
workspace = true
