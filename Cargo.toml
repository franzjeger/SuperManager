[workspace]
resolver = "2"
members = [
    "supermgr-core",
    "supermgr-engine",
    "supermgrd",
    "supermgrd-mac",
    "supermgrd-win",
    "supermgr",
    "supermgr-win",
    "supermgr-mcp",
    "supermanager-helper",
]
# `cargo build` / `cargo test` (no -p / --workspace) only touches this
# list: the two crates that build anywhere, with no GTK, launchd, Apple
# SDK or Windows SDK needed. It keeps a bare `cargo build` fast and
# portable on any dev machine.
#
# It is NOT the set CI builds. Every CI job names its crates with `-p`
# (see .github/workflows/ci.yml) — relying on this list would have meant
# the Linux job compiling neither the daemon nor the GUI, which is
# exactly what it used to do.
#
# Per-host invocations:
#   cargo build -p supermgrd -p supermgr -p supermgr-engine   # Linux
#   cargo build --workspace                                   # macOS only
#   cargo build -p supermgrd-win -p supermgr-win              # Windows
default-members = [
    "supermgr-core",
    "supermgr-mcp",
]

# ---------------------------------------------------------------------------
# Shared dependency versions — all workspace members inherit from here.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio       = { version = "1.42",  features = ["full"] }
# Serialisation
serde       = { version = "1.0",   features = ["derive"] }
serde_json  = { version = "1.0",   default-features = false, features = ["std"] }
toml        = { version = "0.8",   features = ["parse"] }
# Error handling
thiserror   = "2.0"
anyhow      = "1.0"
# Logging / tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
# D-Bus (tokio backend)
zbus        = { version = "5.15",  features = ["tokio"] }
# WireGuard kernel netlink control
wireguard-control = "1.7.1"
# GNOME Keyring / KWallet secret storage
secret-service = { version = "5.0", features = ["rt-tokio-crypto-rust"] }
# Identifiers
uuid        = { version = "1.11", features = ["v4", "serde"] }
# Timestamp / duration
chrono      = { version = "0.4",  features = ["serde"] }
# IP network address arithmetic
ipnet       = { version = "2.10", features = ["serde"] }
# Secure memory wiping
zeroize     = { version = "1.8",  features = ["derive"] }
# Async trait objects
async-trait = "0.1"
# Base64 encoding (secrets file)
base64      = "0.22"
# HTTP client — native-tls for FortiGate compat, rustls-tls for Claude API
#
# `form` and `query` are explicit because 0.13 made them opt-in features that
# 0.12 compiled unconditionally. We build with `default-features = false`, so
# the bump silently removed `RequestBuilder::form` and `::query` — seven call
# sites across the Sophos SOAP envelope, the Azure OAuth token exchange and the
# Tailscale API. That is what the 0.13 upgrade failed on, and it is a feature
# list problem rather than a code one.
reqwest     = { version = "0.13", default-features = false, features = ["json", "form", "query", "native-tls", "stream", "cookies"] }
# SHA-256 for PKCE code_challenge
sha2        = "0.11"
# SSH key generation, parsing, fingerprinting (RustCrypto)
ssh-key     = { version = "0.6",  features = ["ed25519", "rsa", "std", "rand_core", "getrandom"] }
# RSA key generation with bit-size control
rsa         = { version = "0.9",  features = ["std"] }
# Async SSH client (pure Rust, tokio-native)
russh       = "0.46"
# SFTP over russh
russh-sftp  = "2.0"
# SSH key loading for russh authentication
russh-keys  = "0.46"
# Random number generation
rand        = "0.9"
# Template engine for FortiGate / UniFi configuration generation.
# Tera is Jinja-like, supports loops + conditionals + filters,
# and is embedded so users can ship custom templates as plain
# `.tera` files in `~/Library/Application Support/SuperManager/templates/`.
tera        = { version = "1.20", default-features = false, features = ["builtins"] }

# ---------------------------------------------------------------------------
# Workspace-wide lint configuration
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all       = { level = "warn", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
