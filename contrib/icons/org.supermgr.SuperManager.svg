<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    The SuperManager mark, matching the macOS application icon.

    Linux used to ship a different mark entirely — a dark shield with three
    network nodes — so the same application had one identity in the Dock and
    another in the Plasma task manager and tray. This is the macOS artwork
    rebuilt as vector; the desktop entry, the task switcher and the tray all
    draw from it.
  -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#2b3f6b"/>
      <stop offset="45%"  stop-color="#3070c8"/>
      <stop offset="100%" stop-color="#3f8ae8"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="128" height="128" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>

  <g clip-path="url(#rounded)">
    <!-- The two nodes either side of the marker. -->
    <circle cx="24" cy="67" r="4" fill="#a9c3e8"/>
    <circle cx="104" cy="67" r="4" fill="#a9c3e8"/>

    <!-- The arc beneath, suggesting the link between them. -->
    <path d="M17 91 A 47 47 0 0 0 111 91"
          fill="none" stroke="#8fb6ea" stroke-width="4" stroke-linecap="round"
          opacity="0.75"/>

    <!-- The marker: rounded shoulders, tapering to a point. -->
    <path d="M36 34 A 18 18 0 0 1 54 16 L74 16 A 18 18 0 0 1 92 34 L92 52 L64 86 L36 52 Z"
          fill="#f9fafc"/>

    <!-- The upward arrow inside it. -->
    <path d="M64 24 L83 45 L73 45 L73 67 L55 67 L55 45 L45 45 Z" fill="#1f6fc7"/>
  </g>
</svg>
