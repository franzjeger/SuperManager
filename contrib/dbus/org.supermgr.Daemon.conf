<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Access policy for org.supermgr.Daemon.

  The bus restricts who can contact this privileged service. The daemon
  additionally applies polkit actions to credential access, configuration,
  remote execution and machine-wide routing or repair. Active local members
  of supermgr receive routine manage/execute/SSH permissions through the
  installed operator rule; credential exports and routing retain separate
  authentication policies.

  Keep the default block deny-only. CI validates the XML and this boundary.

  Callers allowed:

    - root — the service itself, plus admin scripts.
    - members of the `supermgr` system group — the desktop user running the
      GUI, and `supermgr-mcp`.

  Everyone else is denied. The installer creates the group and adds the
  invoking user; see the group section of `scripts/install-linux.sh`.

  NOTE ON UPGRADES: D-Bus reads a connection's credentials when it connects,
  so a GUI that is already running keeps the groups it started with. After an
  upgrade that adds you to `supermgr`, the running GUI cannot reach the daemon
  until you log out and back in. The installer says so; do not "fix" that by
  loosening this policy.
-->
<busconfig>
  <policy user="root">
    <allow own="org.supermgr.Daemon"/>
    <allow send_destination="org.supermgr.Daemon"/>
  </policy>
  <policy group="supermgr">
    <allow send_destination="org.supermgr.Daemon"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.supermgr.Daemon"/>
  </policy>
</busconfig>
