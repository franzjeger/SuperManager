<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Access policy for org.supermgr.Daemon.

  This file is the daemon's real trust boundary, and it used to allow every
  local account. polkit gates 8 of the daemon's 94 methods; the other 86 —
  including `SshExecuteCommand`, which runs an arbitrary command on a managed
  host using the daemon's stored credentials, and `FortigateGetApiToken`,
  which returns a firewall admin token out of the keyring — had no check at
  all. Any unprivileged local account could therefore reach both. That was
  verified by calling them over the system bus as a normal user and getting no
  authorisation prompt, not inferred from reading the code.

  (No "dash dash" sequences below this line: XML forbids them inside a comment,
  and a policy file D-Bus cannot parse is skipped with a warning — which fails
  open, leaving no restriction at all. `xmllint` in CI is what catches that.)

  Restricting callers here rather than adding polkit to 86 methods is
  deliberate. The GUI is a trusted client acting for the desktop user; making
  it prompt per action would train people to click through prompts, which is
  worse than one membership decision made once at install time. polkit stays
  where it belongs: on the handful of operations that hand out secret material
  or reroute traffic, where a prompt carries information.

  Callers allowed:

    - root — the service itself, plus admin scripts.
    - members of the `supermgr` system group — the desktop user running the
      GUI, and `supermgr-mcp`.

  Everyone else is denied. The installer creates the group and adds the
  invoking user; see the group section of `scripts/install-linux.sh`.

  NOTE ON UPGRADES: D-Bus reads a connection's credentials when it connects,
  so a GUI that is already running keeps the groups it started with. After an
  upgrade that adds you to `supermgr`, the running GUI cannot reach the daemon
  until you log out and back in. The installer says so; do not "fix" that by
  loosening this policy.
-->
<busconfig>
  <policy user="root">
    <allow own="org.supermgr.Daemon"/>
    <allow send_destination="org.supermgr.Daemon"/>
  </policy>
  <policy group="supermgr">
    <allow send_destination="org.supermgr.Daemon"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.supermgr.Daemon"/>
  </policy>
</busconfig>
