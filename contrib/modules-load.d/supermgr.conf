# Kernel modules SuperManager's daemon needs, loaded at boot by
# systemd-modules-load.service.
#
# The daemon cannot load these itself. It runs with
# CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW and deliberately not
# CAP_SYS_MODULE — a VPN manager has no business being able to insert
# code into the kernel. So the modules have to be there before it asks.
#
# Without this the failure is confusing rather than obvious: creating a
# WireGuard interface over netlink returns EOPNOTSUPP, which reads as
# "your kernel does not support WireGuard" when the truth is usually
# "the module is sitting on disk, unloaded".

# WireGuard interfaces, created over netlink by the wireguard-control crate.
wireguard

# /dev/net/tun, opened by openvpn for OpenVPN and Azure VPN profiles.
tun

# nftables, used by the kill switch to block non-VPN traffic.
nf_tables
