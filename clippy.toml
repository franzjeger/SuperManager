# Words that look like code to clippy::doc_markdown but are names of
# products, protocols and services, written the way their owners write them.
# ".." keeps clippy's own list (GitHub, IPv4, macOS, …).
doc-valid-idents = [
    "..",
    "AppleScript",
    "ChmodBPF",
    "ClientHello",
    "CachyOS",
    "DigiCert",
    "FortiClient",
    "FortiGate",
    "FortiGates",
    "FortiOS",
    "IKEv1",
    "IKEv2",
    "IPsec",
    "KWallet",
    "LaunchDaemon",
    "LaunchDaemons",
    "MagicDNS",
    "NetworkExtension",
    "NetworkManager",
    "OAuth2",
    "OPNsense",
    "OpenAI",
    "OpenVPN",
    "OpenVPN3",
    "PackageKit",
    "PowerShell",
    "SuperManager",
    "UniFi",
    "WebAdmin",
    "WiFi",
    "WireGuard",
    "WireGuardNT",
]
