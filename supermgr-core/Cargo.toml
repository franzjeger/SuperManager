[package]
name        = "supermgr-core"
version     = "1.0.0"
edition     = "2021"
description = "Shared types, D-Bus interface definitions, and backend trait for SuperManager"
license     = "GPL-3.0-or-later"

[dependencies]
async-trait    = { workspace = true }
# Shell-safe transport of public keys in `ssh::authorized_keys`
base64         = { workspace = true }
chrono         = { workspace = true }
# Key-pair generation in `ssh::keygen`
rand           = { workspace = true }
ipnet          = { workspace = true }
# Shared long-lived HTTP clients (see `http` module) so the daemon and GUI
# reuse one connection pool instead of building a new one per request.
reqwest        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
anyhow         = { workspace = true }
toml           = { workspace = true }
# SHA-256 fingerprints for the SSH known-hosts store
sha2           = { workspace = true }
ssh-key        = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
zeroize        = { workspace = true }

# macOS: use security-framework for Keychain access
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2"

# Linux: D-Bus and Secret Service (GNOME Keyring)
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { workspace = true }
zbus           = { workspace = true }
# `paths::default_data_dir` branches on whether we are root: the daemon
# writes under /etc/supermgrd, an unprivileged GUI under XDG_DATA_HOME.
nix            = { version = "0.30", features = ["user"] }

# Windows: Credential Manager (via the `keyring` crate's win-native
# backend, which wraps `CredReadW` / `CredWriteW` / `CredDeleteW`).
# We also need tokio's Windows-only named-pipe types for the daemon
# IPC client — those live behind `tokio::net::windows::named_pipe`
# which is gated on `cfg(windows)` in tokio itself, so no extra
# feature flag is required here.
[target.'cfg(target_os = "windows")'.dependencies]
keyring        = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile       = "3"
# `secret_lifecycle` states its guarantee as an invariant over arbitrary
# installs — build any mix of profiles/hosts/keys, delete any one of them,
# assert nothing is left unowned. Enumerating those combinations by hand
# would cover exactly the shapes we already thought of, which is how the
# three shipped leaks got shipped.
proptest       = "1.5"

[lints]
workspace = true
